# cloud-init.yaml
# ↑拡張子が .yaml であることを確認してください

#cloud-config
package_update: true       # パッケージリストを最新化
package_upgrade: true      # 既存パッケージもアップグレード
packages:
  - git
  - python3
  - python3-pip

# SSH 鍵は OpenStack 側で注入されるのでここでは不要ですが、
# 万一を考えて有効化しておくこともできます：
ssh_pwauth: false          # パスワード認証を無効化して公開鍵のみ許可

runcmd:
  - pip3 install --upgrade pip        # pip 自体も最新版に
  - pip3 install ansible
  - ansible-pull \
      -U https://github.com/kashiwai/playbook.git \
      ansible/playbook.yml \
      -i "localhost," \
      -c local